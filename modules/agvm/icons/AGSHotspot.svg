<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Interactive surface outline -->
  <ellipse cx="8" cy="9" rx="5.5" ry="3" fill="#f0a02040" stroke="#f0a020" stroke-width="1.2"/>
  <!-- Cursor hand pointer -->
  <polyline points="8,2 8,7.5" stroke="#f0a020" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="8" cy="2" r="1.2" fill="#f0a020"/>
  <!-- Click ripple -->
  <circle cx="8" cy="9" r="2" fill="none" stroke="#f0a020" stroke-width="0.8" opacity="0.6"/>
</svg>
